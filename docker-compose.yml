version: '3.8'

networks:
  ticketworld-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  seq_data:

services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: ticketworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketworld_db}
      POSTGRES_USER: ${POSTGRES_USER:-ticketworld_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - ticketworld-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketworld_admin} -d ${POSTGRES_DB:-ticketworld_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    container_name: ticketworld-redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes'
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticketworld-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: ticketworld-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ticketworld-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Seq Structured Logging
  seq:
    image: datalust/seq:latest
    container_name: ticketworld-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_INITIAL_PASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "${SEQ_INGESTION_PORT:-5341}:5341"
      - "${SEQ_UI_PORT:-8081}:80"
    volumes:
      - seq_data:/data
    networks:
      - ticketworld-network

  # 5. MailDev Mock SMTP
  maildev:
    image: maildev/maildev:2.1.0
    container_name: ticketworld-maildev
    restart: unless-stopped
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
    networks:
      - ticketworld-network
